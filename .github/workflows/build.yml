name: Build FLEX++ .deb

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本递增方式'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      # ============ 1. 版本自动递增 ============
      - name: Auto-increment version
        id: version
        run: |
          # 读取当前版本
          source FLEXXXVersion
          CURRENT="$FLEXXX_VERSION"
          echo "当前版本: $CURRENT"

          # 解析版本号
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)
          BUILD=$(echo "$CURRENT" | cut -d- -f2)

          # 根据workflow_dispatch的version_bump参数或默认patch递增
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.version_bump }}"
          else
            BUMP="patch"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-${BUILD}"

          # 递增Build号
          BUILD=$((BUILD + 1))

          echo "新版本: ${MAJOR}.${MINOR}.${PATCH}-${BUILD}"

          # 写入版本文件
          cat > FLEXXXVersion << EOF
          # FLEX++ 版本号定义
          # 格式: MAJOR.MINOR.PATCH-BUILD
          # 此文件由 GitHub Actions 自动更新，请勿手动修改
          FLEXXX_VERSION=${MAJOR}.${MINOR}.${PATCH}-${BUILD}
          EOF

          echo "new_version=${MAJOR}.${MINOR}.${PATCH}-${BUILD}" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      # ============ 2. 更新源代码中的版本号宏 ============
      - name: Update version in source
        run: |
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"
          PATCH="${{ steps.version.outputs.patch }}"
          BUILD="${{ steps.version.outputs.build }}"

          FILE="FLEX/FLEXGlobalsViewController.m"

          # 检查是否已有版本号宏，如果没有则插入
          if ! grep -q "FLEXXX_VERSION_MAJOR" "$FILE"; then
            # 用 awk 在 #import "FLEXGlobalsSection.h" 之后插入版本号宏
            awk -v m="$MAJOR" -v n="$MINOR" -v p="$PATCH" -v b="$BUILD" '
              /^#import "FLEXGlobalsSection.h"$/ {
                print
                print "// FLEX++ 版本号 (由GitHub Actions自动更新)"
                print "#define FLEXXX_VERSION_MAJOR " m
                print "#define FLEXXX_VERSION_MINOR " n
                print "#define FLEXXX_VERSION_PATCH " p
                print "#define FLEXXX_VERSION_BUILD " b
                print "#define FLEXXX_VERSION_STRING [NSString stringWithFormat:@\"v%d.%d.%d-%d\", FLEXXX_VERSION_MAJOR, FLEXXX_VERSION_MINOR, FLEXXX_VERSION_PATCH, FLEXXX_VERSION_BUILD]"
                next
              }
              {print}
            ' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          else
            # 已有宏定义，只更新数值
            sed -i '' "s/#define FLEXXX_VERSION_MAJOR [0-9]*/#define FLEXXX_VERSION_MAJOR $MAJOR/" "$FILE"
            sed -i '' "s/#define FLEXXX_VERSION_MINOR [0-9]*/#define FLEXXX_VERSION_MINOR $MINOR/" "$FILE"
            sed -i '' "s/#define FLEXXX_VERSION_PATCH [0-9]*/#define FLEXXX_VERSION_PATCH $PATCH/" "$FILE"
            sed -i '' "s/#define FLEXXX_VERSION_BUILD [0-9]*/#define FLEXXX_VERSION_BUILD $BUILD/" "$FILE"
          fi

          echo "已更新 FLEXGlobalsViewController.m 中的版本号: v$MAJOR.$MINOR.$PATCH-$BUILD"
          grep "FLEXXX_VERSION_" "$FILE"

      # ============ 3. 安装 Theos + ldid ============
      - name: Setup Theos & ldid
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git $HOME/theos
          fi
          # 安装ldid签名工具
          brew install ldid proob 2>/dev/null || brew install ldid 2>/dev/null || true
          # 备选: 从Theos自带编译
          if ! command -v ldid &>/dev/null; then
            git clone https://github.com/ProcursusTeam/ldid.git /tmp/ldid
            cd /tmp/ldid && make -j$(sysctl -n hw.ncpu) && sudo cp ldid /usr/local/bin/
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      # ============ 4. 编译 ============
      - name: Build FLEX++.dylib
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log

      # ============ 5. 收集产物 ============
      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          # 复制.deb
          find . -name "*.deb" -exec cp {} artifacts/ \;
          # 复制.dylib
          find . -name "FLEX++.dylib" -exec cp {} artifacts/ \;
          # 复制build log
          cp build.log artifacts/ 2>/dev/null || true
          
          echo "构建产物:"
          ls -lh artifacts/

      # ============ 6. 上传产物 ============
      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLEX++-v${{ steps.version.outputs.new_version }}
          path: artifacts/
          retention-days: 90

      # ============ 7. 提交版本号变更 ============
      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add FLEXXXVersion FLEX/FLEXGlobalsViewController.m
          
          if git diff --cached --quiet; then
            echo "没有版本变更需要提交"
          else
            git commit -m "🔖 bump: v${{ steps.version.outputs.new_version }} [skip ci]"
            git -c http.extraHeader="Authorization: Bearer ${{ secrets.GH_PAT }}" push
            echo "✅ 已提交版本变更: v${{ steps.version.outputs.new_version }}"
          fi

      # ============ 8. 创建 Release ============
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: FLEX++ v${{ steps.version.outputs.new_version }}
          body: |
            ## FLEX++ v${{ steps.version.outputs.new_version }}

            ### 📦 构建产物
            - `FLEX++.dylib` — 独立动态库，可直接注入任意App
            - `.deb` — 越狱安装包（rootless）

            ### 🚀 安装方式
            - **越狱设备**: 安装.deb包
            - **未越狱**: 使用TrollFools/Dopamine等工具注入dylib
            - **激活**: 双击状态栏呼出/隐藏调试面板

            ### 🔧 更新内容
            - 自动构建版本，更新于 $(date +%Y-%m-%d)

          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
